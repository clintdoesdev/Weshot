name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  ADBLOCK_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, unit and snapshot tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Chromium for the SSRF and capture tests (real browser through the SSRF proxy).
      - run: pnpm --filter @weshot/web exec playwright install --with-deps chromium
      - name: Unit, compositor snapshot, SSRF and capture tests
        run: pnpm test
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs
          path: packages/frame/test/__diff__
          if-no-files-found: ignore

  e2e:
    name: Playwright e2e (mocked capture)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @weshot/web exec playwright install --with-deps chromium
      - name: e2e (desktop + mobile, axe accessibility)
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_E2E: '1'
          E2E_MOCK_CAPTURE: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
